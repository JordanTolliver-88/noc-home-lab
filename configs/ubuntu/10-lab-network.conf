# Receive syslog over UDP 514, only on the MGMT VLAN address
module(load="imudp")
input(type="imudp" port="514" address="10.10.10.1")

# One file per lab device, named by its IP address
template(name="LabPerHost" type="string" string="/var/log/network/%FROMHOST-IP%.log")

# Lab devices go to their own file, and nowhere else
if $fromhost-ip startswith "10.10." then {
    action(type="omfile" dynaFile="LabPerHost")
    stop
}
