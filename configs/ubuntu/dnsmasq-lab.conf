# DHCP only, no DNS (port 53 belongs to Ubuntu's resolver; Pi-hole takes over DNS in Phase 3)
port=0

# Only hand out addresses on the lab VLANs, never on the home network
interface=vlan20
interface=vlan30
bind-dynamic
dhcp-authoritative

# Address pools
dhcp-range=set:servers,10.10.20.100,10.10.20.200,255.255.255.0,12h
dhcp-range=set:users,10.10.30.100,10.10.30.200,255.255.255.0,12h

# Gateway for each VLAN
dhcp-option=tag:servers,option:router,10.10.20.1
dhcp-option=tag:users,option:router,10.10.30.1

# Temporary public DNS until Pi-hole is running
dhcp-option=option:dns-server,1.1.1.1,9.9.9.9

# Raspberry Pi reservation: fill in its MAC address once you have it
dhcp-host=98:fe:54:63:e8:85,rpi4,10.10.20.10

# Log every DHCP exchange (useful for the incident drills)
log-dhcp

