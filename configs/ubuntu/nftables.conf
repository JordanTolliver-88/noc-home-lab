#!/usr/sbin/nft -f

# Recreate only our own tables on reload, so other software's rules
# (Docker in Phase 4) aren't wiped out.
table ip lab_nat
delete table ip lab_nat
table inet lab_filter
delete table inet lab_filter

table ip lab_nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        # Lab traffic leaving for the internet appears to come from Ubuntu
        ip saddr 10.10.0.0/16 oifname "enp1s0" masquerade
    }
}

table inet lab_filter {
    chain forward {
        type filter hook forward priority filter; policy accept;
        # Home network can't start new connections into the lab
        iifname "enp1s0" oifname "vlan*" ct state new drop
    }
}

